<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Kalkulator Taxi z Mapą</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>

    <!-- ŁADOWANIE GOOGLE MAPS JAVASCRIPT API -->
    <script async
        src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBo7fxKQB3dTjyyn0sn5M4wOOIz0KDboYw&callback=initMap&libraries=places">
    </script>
</head>
<body>

<h2>Kalkulator Taxi</h2>

<div class="form">
    <label>Pojazd:</label>
    <select id="vehicle">
        <option value="7" data-base="30">BMW Premium</option>
        <option value="5" data-base="8">Toyota Hybrid</option>
        <option value="4" data-base="8">Standard</option>
    </select>

    <label>Skąd:</label>
    <input id="start" type="text" placeholder="np. Wrocławska 10, Legnica">

    <label>Dokąd:</label>
    <input id="end" type="text" placeholder="np. Złotoryjska 20, Legnica">

    <button id="calcBtn">Oblicz kurs</button>
</div>

<h3>Wynik:</h3>
<div id="output"></div>

<!-- MAPA -->
<div id="map"></div>

</body>
</html>
